    abgerechnet: je Toolaufruf
    hebel: mittel
    owner: bash-owner-dispatch.mjs
    mutator: bash-owner-dispatch.mjs
    stufen_intern: [protect-tests, protect-secrets, rtk-rewrite, bash-dump-guard, squeez-wrap]
    ist_zustand_vorher:
      handler_gezaehlt: 5
      davon_mutierend: 3
      befund: GESETZ_I_VERLETZT
    status: ZU_MIGRIEREN
    wave: 02-1

  - id: posttooluse_bash
    name: PostToolUse Bash
    abgerechnet: einmal geschrieben, danach im Tail
    hebel: workload-abhaengig, oft null
    owner: bash-owner-dispatch.mjs
    mutator: bash-owner-dispatch.mjs
    stufen_intern: [squeez-post, ladder-ledger, bash-size-feedback]
    ist_zustand_vorher:
      handler_gezaehlt: 3
      befund: GESETZ_I_VERLETZT
    status: ZU_MIGRIEREN
    wave: 02-1

  - id: read
    name: Read (Slice und Reread)
    abgerechnet: je Toolaufruf
    hebel: mittel-hoch
    owner: read-context-guard.mjs
    mutator: read-context-guard.mjs
    hinweis: >
      Hier landet die Eskalationsleiter. Nicht als Kompressionsstufe, sondern als
      Dublettensperre: identische Datei, unveraenderte mtime, identischer Hash.
      Auf frischem Quelltext war die erste Stufe einmal aktiv irrefuehrend.
    escape_valve: eine bewusste Einmal-Wiederholung je Denial
    status: OFFEN

  - id: code_retrieval
    name: Code-Retrieval
    abgerechnet: vervielfacht die Read-Flaeche
    hebel: mittel-hoch
    owner: nativ (Search), bedingt colbymchenry/codegraph
    mutator: null
    version_pinnen: true
    verify: true
    verify_frage: >
      CLAUDE.md setzt .codegraph/ und einen aktiven rtk-Hook voraus.
      enabledPlugins fuehrt codegraph nicht, permissions.allow erlaubt es.
      Was gilt?
    gegenbefund: rund 82 Prozent mehr Retrieval-Kontext bleibt resident
    status: ZU_KLAEREN

  - id: session_boundary
    name: Sitzungsgrenze
    abgerechnet: bestimmt das Wachstum aller anderen Flaechen
    hebel: hoch
    owner: TASK-STATE.md + /clear
    mutator: null
    ist_zustand:
      autoCompactEnabled: false
      model: opus[1m]
    hinweis: >
      Es gibt KEINEN automatischen Ausloeser. TASK-STATE und /clear sind nicht eine
      Option unter mehreren, sondern der einzige aktive Mechanismus. Bei 1M-Fenster
      wiegt quadratisches Wachstum achtmal schwerer als in den 128k-Rechnungen.
    status: ZU_STANDARDISIEREN
    wave: 04-1

  - id: external_bulk
    name: Externe Massendaten
