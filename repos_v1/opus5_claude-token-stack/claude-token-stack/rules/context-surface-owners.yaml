    verify: true
    verify_frage: >
      Issue #3480 ist OFFEN: der file-context-Hook reinjiziert denselben
      "prior observations"-Block bei jedem Tool-Call. Dasselbe Muster hat bei
      .claude/rules 46 Prozent des Fensters gekostet (#32057, closed as not planned).
    status: ZU_PRUEFEN

  - id: observation
    name: Beobachtung
    owner: /context, /usage, ccusage, codeburn
    mutator: null
    regel_r8: >
      Observability-Hooks duerfen parallel laufen, sofern sie nichts mutieren und
      keinen Kontext injizieren. Ein ratenlimitierter Hinweis-Hook IST eine
