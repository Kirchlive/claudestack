      Das einzige Repo des Feldes, das ernsthaft auf dem Prefix arbeitet
      (alexgreensh/token-optimizer), steht unter PolyForm Noncommercial und ist
      fuer dienstliche Nutzung gesperrt. Die Flaeche wird von Hand geloest.

  - id: tool_definitions
