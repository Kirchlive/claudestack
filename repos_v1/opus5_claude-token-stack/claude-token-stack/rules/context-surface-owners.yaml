# context-surface-owners.yaml — Owner-Registry (Regel R6)
#
# Ohne diese Tabelle ist Gesetz I nicht ueberpruefbar, sondern nur gut gemeint.
# Je Flaeche GENAU EIN mutierender Eigentuemer. Beobachter duerfen daneben laufen,
# solange sie nichts mutieren und keinen Kontext injizieren (R8).
#
# verify: true  = Punkt ist noch zu klaeren, bevor die Flaeche als besetzt gilt.
# Stand: 2026-08-13, Ist-Zustand gemessen aus settings.json.

version: 1
generated: 2026-08-13
measured_from: settings.json (Ist-Zustand)

surfaces:

  - id: prefix
    name: Request-Prefix (CLAUDE.md, Skill-Listing, Plugin-Metadaten, MCP-Schemata)
    abgerechnet: jede Runde
    hebel: hoch
    owner: Projekt/Nutzer
    mutator: null
